<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>贪吃蛇 - 进化版</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
      touch-action: none;
    }

    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .pixel-title {
      font-size: 18px;
      color: #39ff14;
      text-shadow: 3px 3px 0 #002, -1px -1px 0 #0f0;
      animation: title-glow 1.5s infinite alternate;
    }

    @keyframes title-glow {
      from { text-shadow: 3px 3px 0 #002, -1px -1px 0 #0f0, 0 0 10px #39ff1466; }
      to { text-shadow: 3px 3px 0 #002, -1px -1px 0 #0f0, 0 0 25px #39ff14aa; }
    }

    #hud {
      display: flex;
      gap: 24px;
      font-size: 9px;
      color: #f8f8f8;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hud-item {
      display: flex;
      gap: 8px;
    }

    .hud-label { color: #666; }
    .hud-value { color: #ffd700; text-shadow: 1px 1px 0 #000; }
    .hud-value.level { color: #00ffff; }
    .hud-value.lives { color: #ff6b6b; }
    .hud-value.power { color: #ff00ff; }

    #status-bar {
      display: flex;
      gap: 16px;
      font-size: 7px;
      color: #888;
    }

    .status-item {
      padding: 4px 8px;
      background: #1a1a2e;
      border: 2px solid #3a3a5e;
    }

    .status-item.active {
      color: #39ff14;
      border-color: #39ff14;
      animation: status-pulse 0.5s infinite alternate;
    }

    @keyframes status-pulse {
      from { box-shadow: 0 0 5px #39ff1444; }
      to { box-shadow: 0 0 15px #39ff1488; }
    }

    #canvas-wrapper {
      position: relative;
      padding: 6px;
      background: #1a1a2e;
      border: 4px solid #3a3a5e;
      box-shadow: 0 0 30px rgba(57, 255, 20, 0.15), inset 0 0 20px #0a0a1e;
    }

    canvas {
      display: block;
      background: #0a0a1a;
      image-rendering: pixelated;
    }

    #overlay {
      position: absolute;
      top: 6px; left: 6px; right: 6px; bottom: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(10, 10, 26, 0.97);
      z-index: 10;
      padding: 20px;
    }

    #overlay h1 {
      font-size: 16px;
      color: #39ff14;
      text-shadow: 2px 2px 0 #000;
      text-align: center;
    }

    #overlay h1.game-over { color: #ff3333; animation: shake 0.5s; }
    #overlay h1.paused { color: #00ffff; }
    #overlay h1.level-up { color: #ffd700; animation: level-up 0.5s; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    @keyframes level-up {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    #overlay .info {
      font-size: 7px;
      color: #888;
      line-height: 2;
      text-align: center;
    }

    #overlay .stats {
      font-size: 8px;
      color: #ffd700;
      text-align: center;
      line-height: 2;
    }

    #overlay .achievements {
      font-size: 6px;
      color: #ff00ff;
      text-align: center;
      max-height: 80px;
      overflow-y: auto;
    }

    .pixel-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      padding: 10px 20px;
      background: #39ff14;
      color: #000;
      border: none;
      cursor: pointer;
      clip-path: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px));
      transition: transform 0.1s, background 0.1s;
    }

    .pixel-btn:hover {
      transform: scale(1.05);
      background: #5fff3f;
    }

    .pixel-btn.secondary {
      background: #4a4a7e;
      color: #fff;
    }

    .pixel-btn.secondary:hover {
      background: #6a6a9e;
    }

    #dpad {
      display: none;
      position: relative;
      width: 140px;
      height: 140px;
      margin-top: 12px;
    }

    .dpad-btn {
      position: absolute;
      width: 46px;
      height: 46px;
      background: #2a2a4e;
      border: 3px solid #4a4a7e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #f8f8f8;
      cursor: pointer;
      user-select: none;
    }

    .dpad-btn:active { background: #4a4a7e; }

    #dpad-up { top: 0; left: 47px; border-radius: 8px 8px 0 0; }
    #dpad-down { bottom: 0; left: 47px; border-radius: 0 0 8px 8px; }
    #dpad-left { top: 47px; left: 0; border-radius: 8px 0 0 8px; }
    #dpad-right { top: 47px; right: 0; border-radius: 0 8px 8px 0; }

    #mode-select {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .mode-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      padding: 8px 12px;
      background: #1a1a2e;
      color: #888;
      border: 2px solid #3a3a5e;
      cursor: pointer;
    }

    .mode-btn.selected {
      background: #2a2a4e;
      color: #39ff14;
      border-color: #39ff14;
    }

    #controls-hint {
      font-size: 6px;
      color: #444;
      text-align: center;
    }

    .hidden { display: none !important; }

    #particle-canvas {
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 100;
    }

    @media (max-width: 600px) {
      .pixel-title { font-size: 14px; }
      #hud { font-size: 7px; gap: 12px; }
      #dpad { display: block; }
      #canvas-wrapper { border-width: 3px; padding: 4px; }
      #overlay { top: 4px; left: 4px; right: 4px; bottom: 4px; }
    }

    @media (pointer: coarse) {
      #dpad { display: block; }
    }
  </style>
</head>
<body>
  <canvas id="particle-canvas"></canvas>

  <div id="game-container">
    <div class="pixel-title">贪吃蛇 进化版</div>

    <div id="hud">
      <div class="hud-item"><span class="hud-label">分数</span><span id="score" class="hud-value">0</span></div>
      <div class="hud-item"><span class="hud-label">最高</span><span id="high-score" class="hud-value">0</span></div>
      <div class="hud-item"><span class="hud-label">等级</span><span id="level" class="hud-value level">1</span></div>
      <div class="hud-item"><span class="hud-label">生命</span><span id="lives" class="hud-value lives">3</span></div>
      <div class="hud-item"><span class="hud-label">能量</span><span id="power" class="hud-value power">-</span></div>
    </div>

    <div id="status-bar">
      <div id="status-shield" class="status-item">护盾</div>
      <div id="status-speed" class="status-item">加速</div>
      <div id="status-slow" class="status-item">减速</div>
      <div id="status-ghost" class="status-item">穿墙</div>
      <div id="status-magnet" class="status-item">磁力</div>
    </div>

    <div id="canvas-wrapper">
      <canvas id="canvas"></canvas>
      <div id="overlay">
        <h1>贪吃蛇 进化版</h1>
        <div class="info">
          ↑↓←→ / WASD 移动<br>
          空格 / P 暂停<br>
          吃食物升级 | 收集能量<br>
          存活越久分数越高
        </div>
        <div id="mode-select">
          <button class="mode-btn selected" data-mode="classic">经典</button>
          <button class="mode-btn" data-mode="arcade">街机</button>
          <button class="mode-btn" data-mode="zen">禅</button>
          <button class="mode-btn" data-mode="nightmare">噩梦</button>
        </div>
        <button id="start-btn" class="pixel-btn">开始游戏</button>
      </div>
    </div>

    <div id="dpad">
      <div id="dpad-up" class="dpad-btn">▲</div>
      <div id="dpad-down" class="dpad-btn">▼</div>
      <div id="dpad-left" class="dpad-btn">◀</div>
      <div id="dpad-right" class="dpad-btn">▶</div>
    </div>

    <div id="controls-hint">空格/P暂停 | 滑动屏幕或使用方向键</div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/particle.js"></script>
  <script src="js/game-core.js"></script>
  <script src="js/snake.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
