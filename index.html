<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>贪吃蛇 - 进化版</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0a0a1a 100%);
      background-size: 400% 400%;
      animation: gradient-shift 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
      touch-action: none;
    }

    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .pixel-title {
      font-size: 20px;
      color: #39ff14;
      text-shadow: 0 0 10px #39ff14, 0 0 20px #39ff14, 0 0 30px #39ff14;
      animation: title-glow 2s ease-in-out infinite alternate;
      letter-spacing: 2px;
    }

    @keyframes title-glow {
      from {
        text-shadow: 0 0 10px #39ff14, 0 0 20px #39ff1466, 0 0 30px #39ff1433;
        transform: scale(1);
      }
      to {
        text-shadow: 0 0 20px #39ff14, 0 0 40px #39ff14aa, 0 0 60px #39ff1466;
        transform: scale(1.02);
      }
    }

    #hud {
      display: flex;
      gap: 20px;
      font-size: 9px;
      color: #f8f8f8;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(20, 20, 40, 0.8);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(57, 255, 20, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .hud-item {
      display: flex;
      gap: 8px;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
    }

    .hud-label { color: #888; text-shadow: 1px 1px 0 #000; }
    .hud-value {
      color: #ffd700;
      text-shadow: 0 0 8px #ffd700, 1px 1px 0 #000;
      font-weight: bold;
    }
    .hud-value.level { color: #00ffff; text-shadow: 0 0 8px #00ffff; }
    .hud-value.lives { color: #ff6b6b; text-shadow: 0 0 8px #ff6b6b; }
    .hud-value.power { color: #ff00ff; text-shadow: 0 0 8px #ff00ff; }

    #status-bar {
      display: flex;
      gap: 12px;
      font-size: 7px;
      color: #888;
    }

    .status-item {
      padding: 6px 10px;
      background: rgba(26, 26, 46, 0.9);
      border: 2px solid #3a3a5e;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .status-item.active {
      color: #39ff14;
      border-color: #39ff14;
      background: rgba(57, 255, 20, 0.15);
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.4), inset 0 0 10px rgba(57, 255, 20, 0.1);
      animation: status-pulse 0.8s ease-in-out infinite alternate;
    }

    @keyframes status-pulse {
      from { box-shadow: 0 0 10px rgba(57, 255, 20, 0.4); }
      to { box-shadow: 0 0 25px rgba(57, 255, 20, 0.7), 0 0 40px rgba(57, 255, 20, 0.3); }
    }

    #canvas-wrapper {
      position: relative;
      padding: 8px;
      background: linear-gradient(145deg, #1a1a2e, #0f0f1f);
      border: 4px solid;
      border-image: linear-gradient(145deg, #39ff14, #00ffff, #ff00ff) 1;
      box-shadow: 0 0 40px rgba(57, 255, 20, 0.3), 0 0 80px rgba(57, 255, 20, 0.1), inset 0 0 30px rgba(0, 0, 0, 0.5);
    }

    canvas {
      display: block;
      background: #0a0a1a;
      image-rendering: pixelated;
      border-radius: 4px;
    }

    #overlay {
      position: absolute;
      top: 8px; left: 8px; right: 8px; bottom: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: rgba(10, 10, 26, 0.95);
      backdrop-filter: blur(8px);
      z-index: 10;
      padding: 24px;
      border-radius: 8px;
      border: 2px solid rgba(57, 255, 20, 0.3);
    }

    #overlay h1 {
      font-size: 18px;
      color: #39ff14;
      text-shadow: 0 0 15px #39ff14, 0 0 30px #39ff14;
      text-align: center;
      animation: title-glow 1.5s ease-in-out infinite alternate;
    }

    #overlay h1.game-over {
      color: #ff3333;
      text-shadow: 0 0 15px #ff3333, 0 0 30px #ff3333;
      animation: shake 0.5s, title-glow 1s ease-in-out infinite alternate;
    }
    #overlay h1.paused {
      color: #00ffff;
      text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff;
    }
    #overlay h1.level-up {
      color: #ffd700;
      text-shadow: 0 0 15px #ffd700, 0 0 30px #ffd700;
      animation: level-up 0.8s ease-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px) rotate(-2deg); }
      40% { transform: translateX(8px) rotate(2deg); }
      60% { transform: translateX(-8px) rotate(-2deg); }
      80% { transform: translateX(8px) rotate(2deg); }
    }

    @keyframes level-up {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); opacity: 1; }
    }

    #overlay .info {
      font-size: 8px;
      color: #aaa;
      line-height: 2.2;
      text-align: center;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 8px;
    }

    #overlay .stats {
      font-size: 9px;
      color: #ffd700;
      text-align: center;
      line-height: 2.2;
      background: rgba(255, 215, 0, 0.1);
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 215, 0, 0.3);
    }

    #overlay .achievements {
      font-size: 7px;
      color: #ff00ff;
      text-align: center;
      max-height: 100px;
      overflow-y: auto;
      background: rgba(255, 0, 255, 0.1);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 0, 255, 0.3);
    }

    .pixel-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 12px 24px;
      background: linear-gradient(145deg, #39ff14, #2ecc71);
      color: #000;
      border: none;
      cursor: pointer;
      clip-path: polygon(0 6px, 6px 6px, 6px 0, calc(100% - 6px) 0, calc(100% - 6px) 6px, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 6px calc(100% - 6px), 0 calc(100% - 6px));
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(57, 255, 20, 0.4);
    }

    .pixel-btn:hover {
      transform: scale(1.08) translateY(-2px);
      background: linear-gradient(145deg, #5fff3f, #39ff14);
      box-shadow: 0 6px 25px rgba(57, 255, 20, 0.6);
    }

    .pixel-btn:active {
      transform: scale(0.98);
    }

    .pixel-btn.secondary {
      background: linear-gradient(145deg, #4a4a7e, #3a3a6e);
      color: #fff;
      box-shadow: 0 4px 15px rgba(74, 74, 126, 0.4);
    }

    .pixel-btn.secondary:hover {
      background: linear-gradient(145deg, #6a6a9e, #4a4a7e);
      box-shadow: 0 6px 25px rgba(74, 74, 126, 0.6);
    }

    #dpad {
      display: none;
      position: relative;
      width: 150px;
      height: 150px;
      margin-top: 16px;
    }

    .dpad-btn {
      position: absolute;
      width: 48px;
      height: 48px;
      background: linear-gradient(145deg, #2a2a4e, #1a1a3e);
      border: 3px solid #4a4a7e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #f8f8f8;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .dpad-btn:hover {
      background: linear-gradient(145deg, #3a3a6e, #2a2a4e);
      border-color: #39ff14;
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
    }

    .dpad-btn:active {
      background: #39ff14;
      transform: scale(0.95);
    }

    #dpad-up { top: 0; left: 51px; border-radius: 10px 10px 0 0; }
    #dpad-down { bottom: 0; left: 51px; border-radius: 0 0 10px 10px; }
    #dpad-left { top: 51px; left: 0; border-radius: 10px 0 0 10px; }
    #dpad-right { top: 51px; right: 0; border-radius: 0 10px 10px 0; }

    #mode-select {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .mode-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      padding: 10px 14px;
      background: rgba(26, 26, 46, 0.9);
      color: #888;
      border: 2px solid #3a3a5e;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .mode-btn:hover {
      background: rgba(42, 42, 78, 0.9);
      border-color: #5a5a8e;
    }

    .mode-btn.selected {
      background: rgba(57, 255, 20, 0.15);
      color: #39ff14;
      border-color: #39ff14;
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.3);
    }

    #controls-hint {
      font-size: 6px;
      color: #555;
      text-align: center;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 12px;
      border-radius: 6px;
    }

    .hidden { display: none !important; }

    #particle-canvas {
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 100;
    }

    @media (max-width: 600px) {
      .pixel-title { font-size: 14px; }
      #hud { font-size: 7px; gap: 10px; padding: 10px 14px; }
      #dpad { display: block; }
      #canvas-wrapper { border-width: 3px; padding: 5px; }
      #overlay { top: 5px; left: 5px; right: 5px; bottom: 5px; padding: 16px; }
    }

    @media (pointer: coarse) {
      #dpad { display: block; }
    }
  </style>
</head>
<body>
  <canvas id="particle-canvas"></canvas>

  <div id="game-container">
    <div class="pixel-title">贪吃蛇 进化版</div>

    <div id="hud">
      <div class="hud-item"><span class="hud-label">分数</span><span id="score" class="hud-value">0</span></div>
      <div class="hud-item"><span class="hud-label">最高</span><span id="high-score" class="hud-value">0</span></div>
      <div class="hud-item"><span class="hud-label">等级</span><span id="level" class="hud-value level">1</span></div>
      <div class="hud-item"><span class="hud-label">生命</span><span id="lives" class="hud-value lives">3</span></div>
      <div class="hud-item"><span class="hud-label">能量</span><span id="power" class="hud-value power">-</span></div>
    </div>

    <div id="status-bar">
      <div id="status-shield" class="status-item">护盾</div>
      <div id="status-speed" class="status-item">加速</div>
      <div id="status-slow" class="status-item">减速</div>
      <div id="status-ghost" class="status-item">穿墙</div>
      <div id="status-magnet" class="status-item">磁力</div>
    </div>

    <div id="canvas-wrapper">
      <canvas id="canvas"></canvas>
      <div id="overlay">
        <h1>贪吃蛇 进化版</h1>
        <div class="info">
          ↑↓←→ / WASD 移动<br>
          空格 / P 暂停<br>
          吃食物升级 | 收集能量<br>
          存活越久分数越高
        </div>
        <div id="mode-select">
          <button class="mode-btn selected" data-mode="classic">经典</button>
          <button class="mode-btn" data-mode="arcade">街机</button>
          <button class="mode-btn" data-mode="zen">禅</button>
          <button class="mode-btn" data-mode="nightmare">噩梦</button>
        </div>
        <button id="start-btn" class="pixel-btn">开始游戏</button>
      </div>
    </div>

    <div id="dpad">
      <div id="dpad-up" class="dpad-btn">▲</div>
      <div id="dpad-down" class="dpad-btn">▼</div>
      <div id="dpad-left" class="dpad-btn">◀</div>
      <div id="dpad-right" class="dpad-btn">▶</div>
    </div>

    <div id="controls-hint">空格/P暂停 | 滑动屏幕或使用方向键</div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/particle.js"></script>
  <script src="js/game-core.js"></script>
  <script src="js/snake.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
